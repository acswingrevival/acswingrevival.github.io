<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#0A0E1A"/>

  <!-- Gold decorative circle accent -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#D4A843" stroke-width="0.6" opacity="0.5"/>

  <!-- Female swing dancer silhouette -->

  <!-- Head -->
  <circle cx="16" cy="6" r="2.6" fill="#F5F0E8"/>

  <!-- Neck + torso -->
  <rect x="14.6" y="8.5" width="2.8" height="4.5" rx="1.2" fill="#F5F0E8"/>

  <!-- Left arm raised up (classic swing open pose) -->
  <path d="M14.6 9.5 Q11 7.5 9 5.5" stroke="#F5F0E8" stroke-width="1.7" fill="none" stroke-linecap="round"/>

  <!-- Right arm extended outward -->
  <path d="M17.4 9.5 Q21 8.5 23.5 9.5" stroke="#F5F0E8" stroke-width="1.7" fill="none" stroke-linecap="round"/>

  <!-- Flared dress / skirt (gold — iconic swing silhouette) -->
  <path d="M13.5 13 Q10 16 6.5 27 Q11 24 16 25 Q21 24 25.5 27 Q22 16 18.5 13 Z" fill="#D4A843"/>

  <!-- Small waist detail -->
  <rect x="14.2" y="12.5" width="3.6" height="1.5" rx="0.7" fill="#F5F0E8"/>

  <!-- Left leg peeking from skirt -->
  <path d="M10.5 25.5 Q9.5 28.5 9 31" stroke="#F5F0E8" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Right leg peeking from skirt -->
  <path d="M21.5 25.5 Q22.5 28.5 23 31" stroke="#F5F0E8" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Small musical note accent (bottom-left) -->
  <text x="4" y="30" font-family="serif" font-size="5" fill="#D4A843" opacity="0.7">♪</text>
</svg>
